<div id="<%= id %>">
  <div class="wig-spacer">
    <div class="wig-image-container">
    <% if (media) { %>
      <img id="<%= id %>-img" class="wig-image" alt="<%- media %>" title="<%- media %>"/>
    <% } %>
    </div>
    <p class="wig-text" id="<%= id %>-prompt"><%= txt %></p>
    <%
    if (type === "Text") {
    %>
      <form id="<%= id %>-form" class="wig-input-actions">
        <label>Answer
          <input id="<%= id %>-value" type="text" class="form-control wig-input" aria-describedby="<%= id %>-prompt">
        </label>
        <button type="submit" id="<%= id %>-submit" class="btn btn-success">OK</button>
      </form>
    <%
    } else {
      for(var i = 0 ; i < choices.length ; i++) {
        if (choices[i] != undefined) {
    %>
          <button type="button" id="<%= id %>-choice-<%= i+1 %>" class="btn btn-info btn-block wig-btn"><%- choices[i] %></button>
    <%
        }
      }
    }
    %>
  </div>
  <div class="wig-spacer">
    <button type="button" id="<%= id %>-back" class="btn btn-default btn-block wig-btn">Cancel</button>
  </div>
</div>
