<button type="button" id="<%= id %>" class="btn btn-info btn-block wig-btn wig-list-item">
  <% if (needrouting) { %>
    <span class="wig-list-routing" id="<%= id %>-routing"></span>
  <% } %>
  <% if (icon) { %>
    <img class="wig-list-icon" id="<%= id %>-ico" alt="" aria-hidden="true">
  <% } %>
  <span class="wig-list-label">
    <span class="wig-list-name">
      <% if (complete) { %>
        <span class="glyphicon glyphicon-ok" aria-hidden="true"></span>
      <% } %>
      <%- name %>
    </span>
    <% if (desc) { %>
      <span class="wig-list-description"><%= desc %></span>
    <% } %>
  </span>
</button>
