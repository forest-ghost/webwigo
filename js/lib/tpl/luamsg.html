<%
	pre = typ.toUpperCase()
	if (typ === "error")
		typ = "danger"
%>
<div class="alert alert-<%= typ %>" style="margin: 5px 0px 0px 0px; text-align: justify;">
  <h4><span style="font-weight: bold;"><%= pre %></span><br><%- msg %></h4>
  <button type="button" class="btn btn-default" id="id-lua-notice-ok">Back</button>
</div>
